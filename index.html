  return `<div class="apx96-focus">
    <div class="apx96-focus-top"><div><div class="apx96-kicker">Current exercise</div><div class="apx96-exercise-name">${esc(ex)}</div><div class="apx96-soft" style="margin-top:5px">Move ${Math.max(1,currentExerciseIndex()+1)} of ${template().length}${note?" · "+esc(note):""}</div></div><div class="apx96-set-badge">${complete?"DONE":setNum+"/"+target.sets}</div></div>
    <div class="apx96-set-dots">${Array.from({length:Number(target.sets||3)},(_,index)=>`<i class="apx96-set-dot ${index<done?"done":index===done&&!complete?"active":""}"></i>`).join("")}</div>
    <div class="nxt98-smart-cue"><div><span>${cue.label}</span><b>${esc(cue.copy)}</b></div><strong>${cue.icon}</strong></div>
    <div class="apx96-focus-stats">
      <div class="apx96-focus-stat"><span>Previous</span><b>${last?last.weight+" × "+last.reps:"—"}</b></div>
      <div class="apx96-focus-stat"><span>Target</span><b>${suggested||"—"} × ${repTarget}+</b></div>
      <div class="apx96-focus-stat"><span>Rest</span><b>${Math.round(rest/60*10)/10} min</b></div>
    </div>
    ${complete?"":`<div class="apx96-focus-inputs"><div class="apx96-focus-input-wrap"><div class="nxt98-input-label"><label>Weight · kg</label>${suggested?`<button class="nxt98-use" onclick="nxt98SetInput('weightInput',${Number(suggested)})">USE ${suggested}</button>`:""}</div><input id="weightInput" class="apx96-focus-input" type="number" inputmode="decimal" step="0.1" placeholder="${suggested||0}"></div><div class="apx96-focus-input-wrap"><div class="nxt98-input-label"><label>Repetitions</label><button class="nxt98-use" onclick="nxt98SetInput('repsInput',${Number(repTarget)})">USE ${repTarget}</button></div><input id="repsInput" class="apx96-focus-input" type="number" inputmode="numeric" step="1" placeholder="${repTarget}"></div></div>`}
    <button class="apx96-log-set" onclick="logSet()">${focusButtonLabel(ex,setNum,target)}</button>
    <div class="apx96-focus-secondary"><button onclick="showSubstituteSheet()">CHANGE EXERCISE</button><button onclick="skipExercise()">SKIP EXERCISE</button></div>
  </div>`;
}
function apx96QueueHTML(){
  const list=template();
  if(!list.length)return "";
  const doneMoves=list.filter(item=>safeSetsDone(item.name)>=Number(item.sets||3)).length;
  const next=list.find(item=>safeSetsDone(item.name)<Number(item.sets||3));
  return `<details class="nxt98-queue-details"><summary><div><span>Session queue · ${doneMoves}/${list.length} complete</span><b>${next?esc(next.name):"All movements complete"}</b><small>${next?"Open to view the full order":"Review today’s performance below"}</small></div></summary><div class="nxt98-queue-body"><div class="apx96-queue">${list.map((item,index)=>{
    const done=safeSetsDone(item.name),complete=done>=Number(item.sets||3),active=state.exercise===item.name;
    return `<div class="apx96-queue-row ${active?"active":""} ${complete?"done":""}"><div class="apx96-queue-num">${complete?"✓":index+1}</div><button class="apx96-queue-name" onclick="setExerciseAndRender('${jss(item.name)}')"><b>${esc(item.name)}</b><span>${item.sets} sets · ${item.reps?.[0]||8}–${item.reps?.[1]||12} reps</span></button><span class="apx96-queue-state">${active?"NOW":complete?"DONE":done+"/"+item.sets}</span></div>`;

function nxt98HistoryMatches(date,filter){
  const summary=summaryForDate(date),floor=(state.floorball||[]).some(x=>x.date===date);
  if(filter==="strength")return Number(summary.sets||0)>0;
  if(filter==="conditioning")return Number(summary.z2||0)>0||floor;
  if(filter==="body")return !!summary.bw;
  return true;
}
function nxt98HistoryDates(filter){
  const dates=new Set();
  (state.logs||[]).forEach(x=>x.date&&dates.add(x.date));
  (state.cardio||[]).forEach(x=>x.date&&dates.add(x.date));
  (state.floorball||[]).forEach(x=>x.date&&dates.add(x.date));
  (state.bws||[]).forEach(x=>x.date&&dates.add(x.date));
  return [...dates].filter(date=>nxt98HistoryMatches(date,filter)).sort().reverse().slice(0,20);
}

<script id="apex-v86-keyboard-lock">
document.addEventListener("focusin",function(e){
  if(e.target && ["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)){
    window.__apexTyping=true;
    document.body.classList.add("apex-keyboard-open");
  }
},true);
document.addEventListener("focusout",function(e){
  if(e.target && ["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)){

      document.body.classList.remove("apex-keyboard-open");
    },900);
  }
},true);
</script>

<script>
/* Quick Win: Form Validation with aria-invalid */
function validateField(input) {
  if (!input) return;
  
  let isValid = true;
  const value = input.value?.trim() ?? '';
  
  // Check required
  if (input.required && !value) {
    isValid = false;
  }
  
  // Check type-specific validation
  if (input.type === 'email' && value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
    isValid = false;
  }
  
  if (input.type === 'number' && value) {
    const num = Number(value);
    const min = input.min ? Number(input.min) : -Infinity;
    const max = input.max ? Number(input.max) : Infinity;
    if (isNaN(num) || num < min || num > max) {
      isValid = false;
    }
  }
  
  // Apply aria-invalid
  input.setAttribute('aria-invalid', !isValid);
  return isValid;
}

// Add validation to all form inputs on blur
document.addEventListener('blur', (e) => {
  if (e.target.matches('input, select, textarea')) {
    validateField(e.target);
  }
}, true);

// Clear aria-invalid on focus for better UX
document.addEventListener('focus', (e) => {
  if (e.target.matches('input, select, textarea')) {
    e.target.removeAttribute('aria-invalid');
  }
}, true);
</script>
