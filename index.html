<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<title>NXTFRM — Build Your Next Form</title>
<meta name="description" content="Lean transformation, gym progression and athletic performance in one private fitness OS."/>
<meta property="og:title" content="NXTFRM — Build Your Next Form"/>
<meta property="og:description" content="Lean transformation, gym progression and athletic performance in one private fitness OS."/>
<meta property="og:image" content="social-card.png"/>
<meta property="og:type" content="website"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="NXTFRM — Build Your Next Form"/>
<meta name="twitter:description" content="Lean transformation, gym progression and athletic performance in one private fitness OS."/>
<meta name="twitter:image" content="social-card.png"/>
<style>
:root{
  --bg:#0b0d12;
  --panel:#12151c;
  --panel2:#171b24;
  --panel3:#1e2430;
  --line:rgba(255,255,255,.075);
  --text:#f4f4f5;
  --muted:#9ca3af;
  --muted2:#71717a;
  --purple:#a78bfa;
  --purple2:#8b5cf6;
  --sky:#7dd3fc;
  --green:#a477f5;
  --red:#fb7185;
  --yellow:#facc15;
  --orange:#fb923c;
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Arial,sans-serif;
  width:100%;
  overflow-x:hidden;
  padding-bottom:calc(82px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 15% -8%,rgba(167,139,250,.14),transparent 32%),
    radial-gradient(circle at 100% 5%,rgba(125,211,252,.08),transparent 28%),
    #0b0d12;
}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer;color:inherit;transition:transform .1s ease,opacity .1s ease}
button:active{transform:scale(.985);opacity:.86}
input,select,textarea{outline:0}
.hide{display:none!important}
.app{
  width:100%;
  max-width:430px;
  margin:0 auto;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(180deg,rgba(11,13,18,.94),rgba(11,13,18,.76));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.045);
}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:26px;font-weight:1000;letter-spacing:-1.6px;line-height:1}
.subtitle{font-size:11px;color:var(--muted2);font-weight:700;margin-top:3px}
.score{
  width:42px;height:42px;border-radius:16px;
  display:grid;place-items:center;
  background:rgba(167,139,250,.12);
  border:1px solid rgba(167,139,250,.16);
  color:#ddd6fe;
  font-weight:1000;
  font-size:14px;
}
.content{padding:12px 12px 0}
.card{
  background:linear-gradient(180deg,rgba(23,27,36,.98),rgba(18,21,28,.98));
  border:1px solid var(--line);
  border-radius:24px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 8px 26px rgba(0,0,0,.22);
}
.hero{
  background:
    linear-gradient(135deg,rgba(167,139,250,.15),rgba(125,211,252,.07) 48%,rgba(18,21,28,.98)),
    linear-gradient(180deg,rgba(23,27,36,.98),rgba(18,21,28,.98));
}
.kicker{
  color:var(--muted2);
  font-size:10px;
  font-weight:1000;
  text-transform:legs + corecase;
  letter-spacing:.18em;
}
.big-num{
  font-size:52px;
  line-height:.9;
  font-weight:1000;
  letter-spacing:-4px;
}
.title{
  font-size:22px;
  line-height:1.05;
  letter-spacing:-.9px;
  font-weight:1000;
}
.sub{font-size:12px;color:var(--muted);line-height:1.45}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.metric{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.05);
  border-radius:18px;
  padding:11px 10px;
  min-height:64px;
}
.metric span{display:block;color:var(--muted2);font-size:9px;text-transform:legs + corecase;letter-spacing:.13em;font-weight:1000}
.metric b{display:block;font-size:20px;letter-spacing:-.7px;margin-top:6px}
.progress{
  height:6px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  overflow:hidden;
}
.progress>div{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--purple),var(--sky));
}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:999px;
  padding:6px 9px;
  font-size:11px;
  line-height:1;
  font-weight:900;
  color:#ddd6fe;
  background:rgba(167,139,250,.12);
  border:1px solid rgba(167,139,250,.14);
  white-space:nowrap;
}
.pill.gray{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.055);color:#d4d4d8}
.pill.good{background:rgba(164,119,245,.10);border-color:rgba(164,119,245,.15);color:#bea0ff}
.btn{
  width:100%;
  min-height:48px;
  border-radius:17px;
  font-weight:1000;
  letter-spacing:.03em;
  color:#0b0d12;
  background:linear-gradient(135deg,var(--purple),var(--sky));
}
.btn.secondary{
  background:rgba(255,255,255,.045);
  color:#e5e7eb;
  border:1px solid rgba(255,255,255,.06);
}
.btn.danger{
  background:rgba(251,113,133,.12);
  color:#fecdd3;
  border:1px solid rgba(251,113,133,.18);
}
.label{
  display:block;
  color:var(--muted2);
  font-size:10px;
  font-weight:1000;
  letter-spacing:.16em;
  text-transform:legs + corecase;
  margin-bottom:7px;
}
.input,.select,.textarea{
  width:100%;
  min-height:48px;
  border-radius:16px;
  background:rgba(6,8,12,.55);
  border:1px solid rgba(255,255,255,.075);
  color:var(--text);
  padding:12px 13px;
  font-weight:800;
}
.textarea{min-height:82px;resize:none;font-weight:600}
.input:focus,.select:focus,.textarea:focus{
  border-color:rgba(167,139,250,.45);
  box-shadow:0 0 0 4px rgba(167,139,250,.08);
}
.exercise{
  background:rgba(0,0,0,.16);
  border:1px solid rgba(255,255,255,.055);
  border-radius:21px;
  padding:13px;
}
.exercise-title{font-size:16px;font-weight:950;letter-spacing:-.35px}
.set-row{display:flex;gap:6px;flex-wrap:wrap}
.set-btn{
  width:39px;height:36px;border-radius:13px;
  font-weight:1000;
  color:var(--muted);
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.06);
}
.set-btn.active{background:linear-gradient(135deg,var(--purple),var(--sky));color:#0b0d12;border:0}
.set-btn.done{background:rgba(164,119,245,.10);border-color:rgba(164,119,245,.18);color:#bea0ff}
.list-item{
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.list-item:last-child{border-bottom:0}
.tabs{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  z-index:50;
  width:100%;
  max-width:430px;
  padding:9px 8px calc(10px + env(safe-area-inset-bottom));
  background:rgba(11,13,18,.82);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,.06);
}
.tabs-inner{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{
  height:49px;
  border-radius:17px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.045);
  color:var(--muted);
  font-size:10px;
  font-weight:1000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}
.tab span:first-child{font-size:15px;line-height:1}
.tab.active{
  background:linear-gradient(135deg,var(--purple),var(--sky));
  color:#0b0d12;
  border:0;
}
.modal{
  position:fixed;inset:0;z-index:90;
  display:flex;align-items:flex-end;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.sheet{
  width:100%;
  max-width:430px;
  margin:0 auto;
  border-radius:26px 26px 0 0;
  padding:18px 14px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#20232d,#151922);
  border:1px solid rgba(255,255,255,.09);
  border-bottom:0;
}
.toast{
  position:fixed;
  top:calc(14px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  display:none;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(23,27,36,.96);
  border:1px solid rgba(255,255,255,.12);
  color:white;
  font-size:13px;
  font-weight:900;
  box-shadow:0 12px 36px rgba(0,0,0,.28);
}
@media(max-width:360px){
  .big-num{font-size:46px}
  .title{font-size:20px}
  .content{padding-inline:10px}
  .card{padding:14px}
  .metric{padding:10px 8px}
}

/* V12 additions */
.score-card{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.055);
  border-radius:20px;
  padding:12px;
}
.score-card b{font-size:21px;letter-spacing:-.7px}
.signal{
  height:8px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  overflow:hidden;
}
.signal>div{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--purple),var(--sky));
}
.coach{
  border-radius:20px;
  padding:13px;
  background:linear-gradient(135deg,rgba(167,139,250,.10),rgba(125,211,252,.055));
  border:1px solid rgba(167,139,250,.12);
}
.reco-track{
  position:relative;
  height:10px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--red),var(--yellow),var(--green),var(--sky));
  margin-top:10px;
}
.reco-dot{
  position:absolute;
  top:50%;
  transform:translate(-50%,-50%);
  width:19px;
  height:19px;
  border-radius:50%;
  background:white;
  border:4px solid #11151d;
  box-shadow:0 0 18px rgba(255,255,255,.25);
}
.micro-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
@media(max-width:360px){
  .micro-grid{grid-template-columns:1fr}
}


.gym-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:11px;
}
.gym-switch button{
  min-height:40px;
  border-radius:15px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.055);
  color:var(--muted);
  font-size:12px;
  font-weight:1000;
}
.gym-switch button.active{
  background:linear-gradient(135deg,var(--purple),var(--sky));
  color:#0b0d12;
  border:0;
}

/* V93 Reverted Old Design Only */

/* V25 Preview-approved polish */
.po-card{
  margin-top:12px;
  border-radius:24px;
  border:1px solid rgba(167,139,250,.15);
  background:rgba(16,19,26,.82);
  padding:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}
.po-rail{
  position:relative;
  height:12px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  overflow:visible;
}
.po-fill{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--purple),var(--sky));
  box-shadow:0 0 22px rgba(167,139,250,.22);
}
.po-dot{
  position:absolute;
  top:50%;
  width:24px;
  height:24px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:5px solid #10131a;
  background:white;
  box-shadow:0 0 24px rgba(255,255,255,.28);
}
.po-mini-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
  margin-top:10px;
}
.po-mini{
  border-radius:16px;
  background:rgba(255,255,255,.035);
  padding:8px 6px;
  text-align:center;
  min-width:0;
}
.po-mini.active{
  background:rgba(167,139,250,.08);
  box-shadow:0 0 0 1px rgba(167,139,250,.10) inset;
}
.history-calendar{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
}
.day-cell{
  min-height:58px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.055);
  background:rgba(255,255,255,.035);
  padding:7px 6px;
  text-align:left;
}
.day-cell b{display:block;font-size:11px}
.day-cell span{
  display:block;
  margin-top:13px;
  font-size:9px;
  font-weight:1000;
  letter-spacing:.02em;
  text-transform:legs + corecase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.day-cell.push{background:rgba(167,139,250,.16);border-color:rgba(167,139,250,.20);color:#ddd6fe}
.day-cell.pull{background:rgba(125,211,252,.14);border-color:rgba(125,211,252,.18);color:#bae6fd}

  border-radius:22px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.032);
  padding:12px;
}
.v77-panel-main{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.v77-panel-title{
  min-width:0;
}
.v77-panel-title span{
  display:block;
  color:#77708A;
  font-size:9px;
  font-weight:1000;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.v77-panel-title b{
  display:block;
  margin-top:5px;
  font-size:17px;
  line-height:1.08;
  letter-spacing:-.03em;
}
.v77-panel-title p{
  margin:6px 0 0;
  color:#A7A3B5;
  font-size:11.5px;
  line-height:1.38;
}
.v77-panel-weight{
  flex:0 0 auto;
  text-align:right;
}
.v77-panel-weight b{
  display:block;
  font-size:24px;
  line-height:.95;
  letter-spacing:-.035em;
}
.v77-panel-weight span{
  display:block;
  margin-top:3px;
  color:#77708A;
  font-size:9px;
  font-weight:1000;
  text-transform:uppercase;
}
.v77-metrics{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
  margin-top:11px;
}
.v77-metrics div{
  min-width:0;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.055);
  background:rgba(0,0,0,.13);
  padding:9px 6px;
  text-align:center;
}
.v77-metrics span{
  display:block;
  color:#77708A;
  font-size:8.5px;
  font-weight:1000;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.v77-metrics b{
  display:block;
  margin-top:6px;
  font-size:12px;
  font-weight:1000;
  white-space:nowrap;
}
.v77-footer-note{
  margin:0 16px 15px;
  color:#77708A;
  font-size:10.5px;
  line-height:1.35;
  text-align:center;
}

.v80-float,.v80-mini-readout{pointer-events:none!important}

.v80-progress-card,.v80-chart-box,.v80-stage{touch-action:manipulation}

/* V94 APEX PERFORMANCE UI
   Visual-only compatibility layer: existing IDs, handlers and storage remain unchanged. */
:root{
  --bg:#000000;
  --panel:#111112;
  --panel2:#171618;
  --panel3:#1e1d1f;
  --line:rgba(235,229,244,.085);
  --text:#f6f5f7;
  --muted:#9f9ca4;
  --muted2:#6a686e;
  --purple:#b18aff;
  --purple2:#a477f5;
  --sky:#aa7afa;
  --green:#b18aff;
  --red:#ff758c;
  --yellow:#f7d76b;
  --orange:#ff9a62;
  --radius:26px;
  --shadow:0 22px 55px rgba(0,0,0,.34);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html{background:#000000;overscroll-behavior:none}
body{
  min-height:100dvh;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  color:var(--text);
  background:
    radial-gradient(75% 38% at 8% -4%,rgba(177,138,255,.105),transparent 72%),
    radial-gradient(55% 32% at 104% 11%,rgba(170,122,250,.07),transparent 70%),
    linear-gradient(180deg,#000000 0%,#000000 50%,#000000 100%);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",sans-serif;
  letter-spacing:-.01em;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.24;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(to bottom,black,transparent 64%);
}
.app{max-width:460px;min-height:100dvh;position:relative}
.top{
  padding:calc(12px + env(safe-area-inset-top)) 18px 11px;
  background:linear-gradient(180deg,rgba(0,0,0,.97) 35%,rgba(0,0,0,.78) 82%,transparent);
  border-bottom:0;backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);
}
.top-row{min-height:47px}
.brand-lockup{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;overflow:hidden;
  background:#000000;border:1px solid rgba(177,138,255,.18);
  box-shadow:0 10px 28px rgba(177,138,255,.15),inset 0 1px rgba(255,255,255,.08);
}
.brand-mark img{display:block;width:100%;height:100%}
.logo{font-size:20px;letter-spacing:-1.3px;font-weight:1000;color:#fff}
.logo span{color:#b18aff;text-shadow:0 0 18px rgba(177,138,255,.22)}
.subtitle{margin-top:3px;color:#7d7a82;font-size:8px;text-transform:uppercase;letter-spacing:.17em;font-weight:900}
.score-wrap{display:flex;align-items:center;gap:8px}
.score-label{color:#77747b;font-size:8px;text-transform:uppercase;letter-spacing:.14em;font-weight:950}
.score{
  width:41px;height:41px;border-radius:50%;position:relative;
  color:#e3dbef;background:conic-gradient(var(--green) 0 calc(var(--score,78) * 1%),rgba(255,255,255,.07) 0);
  border:0;font-size:12px;box-shadow:0 0 0 1px rgba(177,138,255,.08),0 10px 24px rgba(0,0,0,.24);
}
.score::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#121113}
.score{isolation:isolate}.score::before{z-index:-1}
.content{padding:8px 14px 0;animation:v94-enter .42s var(--ease)}
@keyframes v94-enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.card,.premium-card,.home-card-clean,.history-calendar-card,.strength-card,.lean-card,.minimum-card,.zone2-card,.focus-premium,.v80-progress-card,.v88-builder-card,.v88-note-card{
  border:1px solid var(--line)!important;

.tabs{

/* V94: APEX performance design system */
/* === QUICK WIN 1: Focus Visible Styles === */
button:focus-visible {
  outline: 2px solid var(--purple);
  outline-offset: 2px;
}

input:focus-visible,

  outline: 2px solid var(--purple);
  outline-offset: 2px;
}

/* === QUICK WIN 2: Reduced Motion Support === */
@media (prefers-reduced-motion: reduce) {
  /* Remove all transitions and animations for users who prefer reduced motion */
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  /* Modal fade-in instead of slide */
  .modal {
    animation: none !important;
  }

  .sheet {
    animation: fadeIn 200ms ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
}

/* === QUICK WIN 3: Enhanced Button Focus for Keyboard Nav === */
button:focus-visible {
  box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.2);
}

/* === QUICK WIN 4: Form Error State === */

// V85 input focus guard
function apexInputActive(){
  const a=document.activeElement;
  return !!(a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName));
}
function apexBlurSafeRender(fn){
  if(apexInputActive()) return;
  if(typeof fn==="function") fn();
}

function exerciseFamily(name){
  for(const [base,names] of Object.entries(EXERCISE_ALIASES)){
    if(names.includes(name)) return base;
  }
  return name;
}
function sameExerciseFamily(a,b){ return exerciseFamily(a)===exerciseFamily(b); }
function familyNames(name){
  const fam=exerciseFamily(name);
  return EXERCISE_ALIASES[fam] || [fam];
}

function render(){
  // V86_RENDER_INPUT_LOCK: never rebuild the page while iOS keyboard/input is active

  const activeElNow=document.activeElement;
  const lockedInput=activeElNow && ["INPUT","TEXTAREA","SELECT"].includes(activeElNow.tagName);
  if(lockedInput || window.__apexTyping || state.typingWeight){
    return;
  }

  try{
    const activeEl=document.activeElement;
    const userIsTyping=activeEl && ["INPUT","TEXTAREA","SELECT"].includes(activeEl.tagName);
    applyDayOverrideForDate();
    if(!userIsTyping && !state.typingWeight) rollToTodayIfNeeded();
    ensureLeanSettings();
    // Saved programmes and session queues are authoritative in V99.
    // Legacy migration helpers remain for old code, but do not rewrite user routines on render.
    const tabName=state.tab||"home";
    const pageIds=["homePage","trainPage","weightPage","historyPage","morePage"];

    pageIds.forEach(id=>{
      const p=document.getElementById(id);
      if(p){
        p.classList.remove("active");
        p.style.display="none";
      }
    });

    const active=document.getElementById(tabName+"Page")||document.getElementById("homePage");
    if(active){
      active.classList.add("active");
      active.style.display="block";
    }

    document.querySelectorAll("[data-tab]").forEach(t=>{
      const isActive=t.dataset.tab===tabName;
      t.classList.toggle("active",isActive);
    });

    if(tabName==="home") renderHome();
    else if(tabName==="train") renderTrain();
    else if(tabName==="weight") renderWeight();
    else if(tabName==="history") renderHistory();
    else if(tabName==="more") renderMore();

    bindTabs();
  }catch(e){
    console.error(e);
    const page=document.getElementById((state.tab||"home")+"Page")||document.getElementById("homePage");
    if(page){
      page.classList.add("active");
      page.style.display="block";

  }
}

function smartProgression(exercise){
  const t=getT(exercise), p=previous(exercise);
  if(!t||!p)return {
    label:"First session",
    next:"",
    reason:"No previous data yet. Log this exercise once to unlock progression.",
    pct:10,
    cls:"gray"
  };
  const sets=p.sets.slice(0,t.sets);
  const reps=sets.map(s=>Number(s.reps)||0);
  const weights=sets.map(s=>Number(s.weight)||0);
  const base=weights[0]||0;
  const min=t.reps[0], max=t.reps[1], inc=Number(t.inc)||2.5;
  const avg=reps.reduce((a,b)=>a+b,0)/Math.max(1,reps.length);
  const allTop=sets.length>=t.sets && reps.every(r=>r>=max);
  const below=reps.filter(r=>r<min).length>=Math.ceil(Math.max(1,sets.length)/2) || avg<min;
  if(Number(state.read.sleep)>0 && Number(state.read.sleep)<6){
    const light=Math.max(0,Math.round((base*0.92)/inc)*inc);
    return {label:"Bad sleep mode",next:light,reason:"Low sleep. Reduce load 5–10%, skip PRs, keep form clean.",pct:25,cls:""};
  }
  if(allTop)return {label:"Increase",next:base+inc,reason:"You hit the top of the rep range for all working sets last time.",pct:92,cls:"good"};
  if(below){
    const down=Math.max(0,Math.round((base*0.92)/inc)*inc);
    return {label:"Decrease slightly",next:down,reason:"Recent reps were below target. Lower weight and rebuild clean reps.",pct:22,cls:""};
  }
  return {label:"Keep weight",next:base,reason:"Stay at this weight and beat reps before increasing.",pct:58,cls:"gray"};
}

function isIsolationExercise(name){
  const n=String(name||"").toLowerCase();
  return n.includes("lateral") || n.includes("fly") || n.includes("curl") || n.includes("pushdown") ||
         n.includes("extension") || n.includes("crunch") || n.includes("calf") || n.includes("adductor") ||
         n.includes("face pull") || n.includes("reverse");
}
function isHeavyCompound(name){
  const n=String(name||"").toLowerCase();
  return n.includes("press") || n.includes("row") || n.includes("pulldown") || n.includes("squat") ||
         n.includes("deadlift") || n.includes("rdl") || n.includes("dip") || n.includes("leg press");
}
function suggestedRestSeconds(exercise){
  const t=getT(exercise);
  const r=readiness().score;
  let sec=120;

  if(state.dayType==="Pump") sec = isIsolationExercise(exercise) ? 60 : 90;
  else if(state.dayType==="Legs") sec = isIsolationExercise(exercise) ? 90 : 150;
  else if(isHeavyCompound(exercise)) sec = 150;
  else if(isIsolationExercise(exercise)) sec = 75;

  if(t && t.reps && t.reps[1] <= 10 && isHeavyCompound(exercise)) sec += 30;
  if(r < 65) sec += 30;
  if(Number(state.read.sleep)>0 && Number(state.read.sleep)<6) sec += 30;

  return Math.max(45, Math.min(240, sec));
}
function restRangeText(seconds){
  if(seconds<=60) return "45–60 sec";
  if(seconds<=75) return "60–75 sec";
  if(seconds<=90) return "75–90 sec";
  if(seconds<=120) return "90–120 sec";
  if(seconds<=150) return "2–2.5 min";
  if(seconds<=180) return "2.5–3 min";
  return "3–4 min";
}
function restReason(exercise){
  if(state.dayType==="Pump") return "Pump day: keep rests shorter so the session stays recovery-friendly.";
  if(state.dayType==="Legs" && isHeavyCompound(exercise)) return "Leg compound: take longer rest so performance does not crash.";
  if(isHeavyCompound(exercise)) return "Heavy compound: rest enough to keep strength and reps stable.";
  if(isIsolationExercise(exercise)) return "Isolation movement: shorter rest is enough. Keep reps controlled.";
  return "Balanced rest for clean reps.";
}
function restSuggestionCardHTML(exercise){

  if(state.dayType==="Pump") tags.push("pump");

}

    if(w===bestWeight && r>bestRepsAtWeight) bestRepsAtWeight=r;
    if(v>bestVolume) bestVolume=v;
    if(e>bestE1RM) bestE1RM=e;
  });
  return {bestWeight,bestRepsAtWeight,bestVolume,bestE1RM,rows};
}
function detectPR(entry){
  const before=bestStatsBefore(entry.exercise, entry.id);
  const w=Number(entry.weight)||0, r=Number(entry.reps)||0, v=w*r, e=w*(1+r/30);
  const prs=[];
  if(before.rows.length===0){
    prs.push({type:"First Log",text:"First logged set for this movement family."});
  }else{
    if(w>before.bestWeight) prs.push({type:"Weight PR",text:`New heaviest set: ${w}kg`});
    if(w===before.bestWeight && r>before.bestRepsAtWeight) prs.push({type:"Rep PR",text:`More reps at your best weight: ${w}kg × ${r}`});
    if(v>before.bestVolume) prs.push({type:"Volume PR",text:`Best set volume: ${Math.round(v)}kg`});
    if(e>before.bestE1RM) prs.push({type:"Est. 1RM PR",text:`Estimated 1RM: ${e.toFixed(1)}kg`});
  }
  return prs;
}

function safeLastSet(ex){

    .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")) || (Number(a.ts||0)-Number(b.ts||0)));
  return rows.length?rows[rows.length-1]:null;
}
function safeSuggestedWeight(ex){

function safeSetsDone(ex){

function safeFamily(ex){

function sameExerciseForProgress(l,ex){

function sortedExerciseLogs(ex,{gymSpecific=true}={}){

    .filter(l=>sameExerciseForProgress(l,ex))
    .filter(l=>!gymSpecific || !l.gym || !state.gym || String(l.gym).toLowerCase()===String(state.gym).toLowerCase())
    .sort((a,b)=>{

function rowsByDate(rows){
  const by={};
  rows.forEach(l=>{
    const d=l.date||state.date;
    if(!by[d])by[d]=[];
    by[d].push(l);
  });

}
function comparableRowsForProgress(ex){
  const today=(state.logs||[])
    .filter(l=>l.date===state.date && sameExerciseForProgress(l,ex))
    .sort((a,b)=>(Number(a.setNum||0)-Number(b.setNum||0)) || (Number(a.ts||0)-Number(b.ts||0)));
  if(today.length)return {rows:today,source:"today"};
  let rows=sortedExerciseLogs(ex,{gymSpecific:true}).filter(l=>l.date!==state.date);
  if(!rows.length)rows=sortedExerciseLogs(ex,{gymSpecific:false}).filter(l=>l.date!==state.date);
  const by=rowsByDate(rows);
  const dates=Object.keys(by).sort();
  const lastDate=dates[dates.length-1];
  if(!lastDate)return {rows:[],source:"none"};
  return {rows:by[lastDate].sort((a,b)=>(Number(a.setNum||0)-Number(b.setNum||0)) || (Number(a.ts||0)-Number(b.ts||0))),source:lastDate};
}
function progressiveOverloadStatus(ex){
  const target=getT(ex)||{sets:3,reps:[8,12],inc:2.5};
  const minRep=Number(target.reps?.[0]||8);
  const maxRep=Number(target.reps?.[1]||12);
  const targetSets=Number(target.sets||3);
  const inc=Number(target.inc||2.5);
  const data=comparableRowsForProgress(ex);
  const rows=data.rows||[];
  if(!rows.length){
    return {pct:18,label:"Build baseline",tone:"hold",pill:"No data",detail:`Log ${targetSets} sets in the ${minRep}–${maxRep} rep range to create your first progression target.`,next:`${safeSuggestedWeight(ex)||0}kg`};
  }
  const reps=rows.map(r=>Number(r.reps||0)).filter(n=>Number.isFinite(n));
  const weights=rows.map(r=>Number(r.weight||0)).filter(n=>Number.isFinite(n));
  const loggedSets=rows.length;
  const avgReps=reps.length ? reps.reduce((a,b)=>a+b,0)/reps.length : 0;
  const minLoggedRep=reps.length ? Math.min(...reps) : 0;
  const topWeight=weights.length ? Math.max(...weights) : Number(safeSuggestedWeight(ex)||0);
  const targetReps=reps.slice(0,targetSets);
  const allAtTopRange=loggedSets>=targetSets && targetReps.every(r=>r>=maxRep);
  const allAtMinRange=loggedSets>=targetSets && targetReps.every(r=>r>=minRep);
  const repScore=Math.min(1,Math.max(0,avgReps/maxRep));
  const setScore=Math.min(1,loggedSets/targetSets);
  let pct=Math.round((repScore*.72 + setScore*.28)*100);
  pct=Math.max(12,Math.min(100,pct));
  let label="Build reps", tone="", pill=`${Math.round(pct)}%`;
  let detail=`Based on ${data.source==="today"?"today":fmt(data.source)}: ${loggedSets}/${targetSets} sets, avg ${avgReps.toFixed(1)} reps.`;
  const cfg=ensureLeanSettings();
  const readyEnough=(typeof readiness==="function"?readiness().score:75)>=65;
  if(allAtTopRange && (!cfg.enabled || !cfg.conservativeProgression || readyEnough)){
    label="Ready to increase"; tone="ready"; pill=`+${inc}kg`; pct=100;
    detail=`You hit ${maxRep}+ reps across your target sets. Increase next time if form stayed clean.`;
  }else if(allAtTopRange && cfg.enabled && cfg.conservativeProgression && !readyEnough){
    label="Hold despite performance"; tone="hold"; pill="Recover"; pct=88;
    detail=`Reps are ready, but recovery is not. Hold weight today and increase only when readiness improves.`;
  }else if(allAtMinRange && avgReps>=((minRep+maxRep)/2)){
    label="Hold weight, beat reps"; tone=""; pill="Build";
    detail+=` Keep ${topWeight}kg and move each set closer to ${maxRep} reps.`;
  }else if(loggedSets>=targetSets && minLoggedRep<minRep){
    label="Hold / clean it up"; tone="hold"; pill="Hold"; pct=Math.min(pct,68);
    detail+=` One or more sets fell below ${minRep} reps, so do not increase yet.`;
  }else if(data.source==="today" && loggedSets<targetSets){
    label="Finish working sets"; tone=""; pill=`${loggedSets}/${targetSets}`;
    detail=`Complete the remaining sets before deciding whether to increase next session.`;
  }
  return {pct,label,tone,pill,detail,next: allAtTopRange ? `${topWeight+inc}kg` : `${topWeight}kg`};
}
function progressiveOverloadCardHTML(ex){
  const p=progressiveOverloadStatus(ex);
  const pct=Math.max(8,Math.min(100,Number(p.pct)||0));
  return `<div class="po-card">

function dateKey(d){ return new Date(d+"T12:00:00"); }
function monthCalendarDays(dateStr){
  const base=new Date(dateStr+"T12:00:00");
  const y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);
  const offset=(first.getDay()+6)%7;
  const days=[];
  for(let i=0;i<offset;i++) days.push(null);
  for(let d=1; d<=last.getDate(); d++){
    const iso=new Date(y,m,d+1).toISOString().slice(0,10);
    days.push({day:d,date:iso});
  }
  while(days.length%7!==0) days.push(null);
  return days;
}
function dayTrainingType(date){
  const logs=state.logs.filter(l=>l.date===date);
  const floor=state.floorball.some(f=>f.date===date);
  const rest=state.rest.some(r=>r.date===date);
  if(floor) return "Floorball";
  if(logs.length){
    const counts={};
    logs.forEach(l=>counts[l.dayType||"Workout"]=(counts[l.dayType||"Workout"]||0)+1);
    return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  }
  if(rest) return "Rest";
  return "";
}

function latestEvoScan(){

function scanDelta(key){
  const latest=latestEvoScan(), prev=previousEvoScan();
  if(!latest || !prev || !Number(latest[key]) || !Number(prev[key])) return "—";
  const d=Number(latest[key])-Number(prev[key]);

  return sign + d.toFixed(key==="tdee"?0:1);
}
function scanImageToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function handleScanFile(input){

function fillScanField(id,value){

  if(el && value!==undefined && value!==null && value!=="") el.value=value;

function numFromText(patterns,text){
  for(const p of patterns){
    const m=text.match(p);
    if(m && m[1]) return m[1].replace(/,/g,"");
  }
  return "";
}
function extractEvoValues(text){
  const clean=String(text||"")
    .replace(/[|]/g," ")
    .replace(/\s+/g," ")
    .replace(/O/g,"0");

  const weight=numFromText([
    /weight[^0-9]{0,20}(\d{2,3}\.?\d?)/i,
    /body\s*weight[^0-9]{0,20}(\d{2,3}\.?\d?)/i,
    /(\d{2,3}\.\d)\s*kg/i
  ], clean);

  const bodyFat=numFromText([
    /body\s*fat\s*(?:percentage|percent|%)?[^0-9]{0,20}(\d{1,2}\.?\d?)/i,
    /fat\s*%[^0-9]{0,20}(\d{1,2}\.?\d?)/i,
    /pbf[^0-9]{0,20}(\d{1,2}\.?\d?)/i
  ], clean);

  const muscleMass=numFromText([
    /muscle\s*mass[^0-9]{0,20}(\d{2,3}\.?\d?)/i,
    /skeletal\s*muscle[^0-9]{0,20}(\d{2,3}\.?\d?)/i,
    /smm[^0-9]{0,20}(\d{2,3}\.?\d?)/i
  ], clean);

  const fatMass=numFromText([
    /fat\s*mass[^0-9]{0,20}(\d{1,3}\.?\d?)/i,
    /body\s*fat\s*mass[^0-9]{0,20}(\d{1,3}\.?\d?)/i
  ], clean);

  const tdee=numFromText([
    /tdee[^0-9]{0,20}(\d{3,5})/i,
    /tee[^0-9]{0,20}(\d{3,5})/i,
    /total\s*daily\s*energy[^0-9]{0,20}(\d{3,5})/i
  ], clean);

  const bmr=numFromText([
    /bmr[^0-9]{0,20}(\d{3,5})/i,
    /basal\s*metabolic[^0-9]{0,20}(\d{3,5})/i
  ], clean);

  fillScanField("scanWeight",weight);
  fillScanField("scanBodyFat",bodyFat);
  fillScanField("scanMuscleMass",muscleMass);
  fillScanField("scanFatMass",fatMass);
  fillScanField("scanTDEE",tdee);
  fillScanField("scanBMR",bmr);
}
async function readEvoScanOCR(){
  const fileInput=document.getElementById("scanFile");
  const file=fileInput && fileInput.files && fileInput.files[0];
  if(!file){toast("Upload scan first");return;}
  if(typeof Tesseract==="undefined"){
    toast("OCR library not loaded");
    setScanStatus("OCR needs internet to load Tesseract.js.");
    return;
  }
  setScanStatus("Reading scan... this can take 10–30 seconds");
  const output=document.getElementById("ocrOutput");
  if(output) output.textContent="Reading scan...";
  try{
    const result=await Tesseract.recognize(file,"eng",{
      logger:m=>{
        if(m && m.status){
          const pct=m.progress ? ` ${Math.round(m.progress*100)}%` : "";
          setScanStatus(`${m.status}${pct}`);
        }
      }
    });
    const text=result.data.text || "";
    if(output) output.textContent=text || "No text detected.";
    extractEvoValues(text);
    setScanStatus("OCR complete. Check and edit the numbers before saving.");
    toast("Scan read. Please confirm values.");
  }catch(e){
    console.error(e);
    setScanStatus("OCR failed. Enter values manually.");
    toast("OCR failed");
  }
}

    "Unilateral Seated Row":["Single-Arm Cable Row","Single-Arm Machine Row","DB Row"],
    "Reverse Fly":["Rear Delt Machine","Cable Reverse Fly","Face Pull"],

    "Rope Triceps Pushdown":["Straight-Bar Triceps Pushdown","Single-Arm Cable Pushdown","Overhead Cable Triceps Extension"],
    "Cable Crunch":["Hanging Knee Raise","Machine Crunch","Plank"]
  };
  const base=getT(ex) || {sets:3,reps:[8,12],inc:2.5};
  return (map[ex] || ["Alternative Machine","Dumbbell Alternative","Cable Alternative"]).map(n=>({
    name:n, sets:base.sets||3, reps:base.reps||[8,12], inc:base.inc||2.5, time:base.time||false
  }));
}
function safeSubstituteOptions(ex){
  try{
    const opts = typeof substituteOptions==="function" ? substituteOptions(ex) : [];
    if(opts && opts.length) return opts;
  }catch(e){}
  return fallbackSubstitutions(ex);
}

function useSubstituteTemp(index){
  const original=tempSubstituteContext.original || state.exercise;
  const opts=tempSubstituteContext.options || [];
  const o=opts[index];
  if(!o){toast("Alternative not found");return;}
  const list=TEMPLATES[state.dayType] || [];
  const current=state.exercise || original;
  let idx=list.findIndex(e=>e.name===current);
  if(idx<0) idx=list.findIndex(e=>e.name===original);
  const base=getT(original) || getT(current) || {sets:3,reps:[8,12],inc:2.5};
  const replacement={
    name:o.name,
    sets:Number(o.sets || base.sets || 3),
    reps:o.reps || base.reps || [8,12],
    inc:Number(o.inc ?? base.inc ?? 2.5)
  };
  if(o.time || base.time) replacement.time=true;
  if(idx>=0) list[idx]=replacement;
  state.exercise=o.name;
  state.setNum=setsDone(o.name)+1;
  closeModal();
  render();
  toast("Exercise changed");

if("serviceWorker" in navigator && location.hostname==="localhost"){
  // Local dev serves files uncached, and any worker from an earlier visit is removed.
  navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(reg=>reg.unregister())).catch(()=>{});
}else if("serviceWorker" in navigator && location.protocol!=="file:" && !window.NXTFRM_STANDALONE){
  let apexSwRefreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(apexSwRefreshing)return;
    apexSwRefreshing=true;
    // Preserve in-progress input. Reopening the app will load the new version.
    if(document.activeElement && ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){
      toast("Update ready. Finish your entry, then reopen the app.");
      return;

    if((state.logs||[]).some(row=>row.date===state.date)){
      toast("Update ready. Your session is saved; reopen when ready.");

  });
  navigator.serviceWorker.register("./sw.js").then(reg=>reg.update()).catch(()=>{});

function notificationSupported(){return "Notification" in window}
function notificationPermissionLabel(){
  if(!notificationSupported()) return "unsupported";

async function requestAppNotifications(){
  if(!notificationSupported()){toast("Notifications not supported here");return}
  try{
    const perm=await Notification.requestPermission();
    state.notifs.enabled=(perm==="granted");

    if(perm==="granted"){
      sendAppNotification("NXTFRM notifications on","Test reminders are ready.");
      toast("Notifications enabled");
    }else{
      toast("Notifications not allowed");
    }
  }catch(e){toast("Notification permission failed")}

async function sendAppNotification(title,body){
  if(!notificationSupported() || Notification.permission!=="granted") return false;
  try{
    if("serviceWorker" in navigator){
      const reg=await navigator.serviceWorker.ready;
      if(reg && reg.showNotification){
        await reg.showNotification(title,{body,tag:"nxtfrm",badge:"icon-192.png",icon:"icon-192.png"});
        return true;
      }
    }
    new Notification(title,{body});
    return true;
  }catch(e){
    try{new Notification(title,{body});return true}catch(_){return false}
  }
}

function currentHHMM(){

function weeklyDayCode(){

function checkScheduledNotifications(){
  if(!state.notifs?.enabled || !notificationSupported() || Notification.permission!=="granted") return;
  const now=currentHHMM();

  if(state.notifs.weighIn && now===state.notifs.weighInTime){
    const key=notificationDayKey("weighin");
    if(!state.notifs.sent[key]){
      state.notifs.sent[key]=true;
      persist();
      sendAppNotification("Morning weigh-in","Log your weight before food/water if possible.");

  if(state.notifs.backup && weeklyDayCode()===state.notifs.backupDay && now==="20:00"){
    const key=notificationDayKey("backup");
    if(!state.notifs.sent[key]){
      state.notifs.sent[key]=true;
      persist();
      sendAppNotification("Back up NXTFRM","Export your data so your logs stay safe.");
    }
  }
}

function readImportFile(input){
  const file=input.files && input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      previewRestore(data);
    }catch(e){
      toast("Invalid JSON file");
    }
  };
  reader.readAsText(file);
}

function previewRestore(data){
  window.pendingApexRestore=data;
  const box=document.getElementById("restorePreview");
  if(!box)return;
  const ls=data.localStorageDump||{};
  const parsed=(key)=>{
    try{return JSON.parse(ls[key]||"[]")}catch(e){return []}
  };
  const logs=data.logs || parsed("apm_logs");
  const bws=data.bws || parsed("apm_bws");
  const cardio=data.cardio || parsed("apm_cardio");
  const floorball=data.floorball || parsed("apm_floorball");

function restoreBackup(){
  const data=window.pendingApexRestore;
  if(!data){toast("Choose backup first");return}
  if(!confirm("Restore this backup? This will replace current app data.")) return;

  const ls=data.localStorageDump||{};
  const parse=(key, fallback)=>{
    if(data[fallback]!==undefined) return data[fallback];
    try{return JSON.parse(ls[key]||"[]")}catch(e){return []}
  };

  state.logs=parse("apm_logs","logs")||[];
  state.cardio=parse("apm_cardio","cardio")||[];
  state.floorball=parse("apm_floorball","floorball")||[];
  state.bws=parse("apm_bws","bws")||[];
  state.scans=parse("apm_evo_scans","scans")||[];
  state.rest=parse("apm_rest","rest")||[];

  if(data.current){
    state.gym=data.current.gym||state.gym;
    state.gyms=data.current.gyms||state.gyms;
    state.read=data.current.read||state.read;
    state.dayType=data.current.dayType||state.dayType;
    state.exercise=data.current.exercise||state.exercise;
  }

  if(data.settings){
    settings={...settings,...data.settings};
    START_WEIGHT=Number(settings.startWeight)||START_WEIGHT;
    TARGET_HIGH=Number(settings.targetHigh)||TARGET_HIGH;
    TARGET_LOW=Number(settings.targetLow)||TARGET_LOW;
    USER_TDEE=Number(settings.tdee)||USER_TDEE;
    ZONE2_WEEKLY_TARGET=Number(settings.zone2WeeklyTarget)||ZONE2_WEEKLY_TARGET;
  }

  if(data.notifications) state.notifs={...state.notifs,...data.notifications};

  persist();
  render();
  toast("Backup restored");
}

function applyCloudPayload(d){
  if(!d)return;
  state.logs=d.logs||state.logs||[];
  state.cardio=d.cardio||state.cardio||[];
  state.floorball=d.floorball||state.floorball||[];
  state.bws=d.bws||state.bws||[];
  state.scans=d.scans||state.scans||[];
  state.rest=d.rest||state.rest||[];
  state.read=d.read||state.read||{};
  state.gyms=d.gyms||state.gyms||["Gym A","Gym B"];
  state.gym=d.gym||state.gym||"Gym A";
  if(d.notifs) state.notifs={...state.notifs,...d.notifs};
  if(d.current){
    state.date=d.current.date||state.date;
    state.dayType=d.current.dayType||state.dayType;
    state.exercise=d.current.exercise||state.exercise;
    state.setNum=d.current.setNum||state.setNum;
  }
  if(d.settings){
    settings={...settings,...d.settings};
    START_WEIGHT=Number(settings.startWeight)||START_WEIGHT;
    TARGET_HIGH=Number(settings.targetHigh)||TARGET_HIGH;
    TARGET_LOW=Number(settings.targetLow)||TARGET_LOW;
    USER_TDEE=Number(settings.tdee)||USER_TDEE;
    ZONE2_WEEKLY_TARGET=Number(settings.zone2WeeklyTarget)||ZONE2_WEEKLY_TARGET;
  }
  persist();
}
function initSupabaseClient(){
  const url=localStorage.getItem("apm_sb_url")||"";
  const key=localStorage.getItem("apm_sb_key")||"";
  if(!url||!key||!window.supabase)return null;
  if(!sbClient) sbClient=window.supabase.createClient(url,key);
  return sbClient;
}
async function initCloudFromStorage(){
  try{
    const client=initSupabaseClient();
    if(!client)return;
    const {data}=await client.auth.getSession();
    if(data && data.session && data.session.user){
      cloudUser=data.session.user;
      cloudStatusText="Connected";
      render();
    }
  }catch(e){}
}
function scheduleCloudSave(){
  if(!cloudUser)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>saveCloudNow(false),900);
}
async function saveCloudNow(show=true){
  try{
    const client=initSupabaseClient();
    if(!client || !cloudUser){
      if(show)toast("Cloud not connected");
      return;
    }
    const payload=getCloudPayload();

    // Existing table may not have an email column, so save only required columns.
    let row={
      user_id:cloudUser.id,
      data:payload,
      updated_at:new Date().toISOString()
    };

    let {error}=await client
      .from("apexcut_profiles")
      .upsert(row,{onConflict:"user_id"});

    // If older table has no updated_at column, retry with only user_id + data.
    if(error && String(error.message||"").toLowerCase().includes("updated_at")){
      row={user_id:cloudUser.id,data:payload};
      const retry=await client
        .from("apexcut_profiles")
        .upsert(row,{onConflict:"user_id"});
      error=retry.error;
    }

    if(error)throw error;
    cloudStatusText="Saved online";
    if(show)toast("Saved to Supabase");
    render();
  }catch(e){
    if(show)toast(e.message||"Cloud save failed");
    else toast(e.message||"Cloud autosave failed");
  }
}
async function loadCloudNow(){
  try{
    const client=initSupabaseClient();
    if(!client || !cloudUser){
      toast("Cloud not connected");
      return;
    }
    const {data,error}=await client
      .from("apexcut_profiles")
      .select("data")
      .eq("user_id",cloudUser.id)
      .maybeSingle();
    if(error)throw error;
    if(data && data.data){
      applyCloudPayload(data.data);
      cloudStatusText="Loaded online";
      toast("Loaded from Supabase");
      render();
    }else{
      toast("No cloud data yet");
    }
  }catch(e){toast(e.message||"Cloud load failed")}
}

function svgSmoothPath(points){
  if(!points || points.length===0)return "";
  if(points.length===1)return `M ${points[0].x} ${points[0].y}`;
  let d=`M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
  for(let i=0;i<points.length-1;i++){
    const p0=points[Math.max(0,i-1)];
    const p1=points[i];
    const p2=points[i+1];
    const p3=points[Math.min(points.length-1,i+2)];
    const cp1x=p1.x+(p2.x-p0.x)/6;
    const cp1y=p1.y+(p2.y-p0.y)/6;
    const cp2x=p2.x-(p3.x-p1.x)/6;
    const cp2y=p2.y-(p3.y-p1.y)/6;
    d+=` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

function v76WeeklyRows(rows){
  const weeks={};
  rows.forEach(r=>{

function v76LinearSlope(rows){
  if(rows.length<2)return 0;
  const xs=rows.map((_,i)=>i);
  const ys=rows.map(r=>Number(r.avg));
  const xm=xs.reduce((a,b)=>a+b,0)/xs.length;
  const ym=ys.reduce((a,b)=>a+b,0)/ys.length;
  const num=xs.reduce((s,x,i)=>s+(x-xm)*(ys[i]-ym),0);
  const den=xs.reduce((s,x)=>s+(x-xm)*(x-xm),0)||1;
  return num/den;
}
function v76ForecastInfo(rows,low,high){
  const latest=rows[rows.length-1];
  if(!latest)return {weeks:null,text:"Need more data"};
  const slope=v76LinearSlope(rows); // kg per point
  const dayGap=rows.length>1?Math.max(1,(v75ParseDate(rows[rows.length-1].date)-v75ParseDate(rows[0].date))/(86400000*(rows.length-1))):1;
  const kgPerDay=slope/dayGap;
  if(kgPerDay>=-.02)return {weeks:null,text:"Trend is not moving toward lean zone yet."};
  const target=high;
  const days=(Number(latest.avg)-target)/Math.abs(kgPerDay);
  if(days<0)return {weeks:0,text:"You are already near/inside lean zone."};
  return {weeks:Math.ceil(days/7),text:`At this pace: ~${Math.ceil(days/7)} weeks to top of lean zone.`};
}

function v80RawRows(){

function v80WeeklyStats(rows){
  const weeks={};
  rows.forEach(r=>{const d=new Date((r.date||state.date)+"T12:00:00");const start=new Date(d);start.setDate(d.getDate()-((d.getDay()+6)%7));const key=start.toISOString().slice(0,10);if(!weeks[key])weeks[key]=[];weeks[key].push(Number(r.weight));});
  const vals=Object.entries(weeks).map(([date,arr])=>({date,avg:arr.reduce((a,b)=>a+b,0)/arr.length}));
  const thisWeek=vals[vals.length-1]?.avg,lastWeek=vals[vals.length-2]?.avg;
  return {thisWeek,lastWeek,change:(Number.isFinite(thisWeek)&&Number.isFinite(lastWeek))?thisWeek-lastWeek:null};
}
function v80CutRead(rows,low,high){
  const latest=rows[rows.length-1];
  if(!latest)return {title:"No data",text:"Log your bodyweight to start seeing trend insights.",icon:"·"};
  const weekly=v80WeeklyStats(rows);
  if(Number.isFinite(weekly.change)&&weekly.change>0.3)return {title:"Water spike, not failure",text:"This week is up slightly. Watch the average before changing calories.",icon:"↗"};
  if(Number(latest.weight)<=high&&Number(latest.weight)>=low)return {title:"Inside lean zone",text:"You are in your target range. Shift focus to performance and maintenance.",icon:"✓"};
  return {title:"Trend is clean",text:"The average is moving down smoothly. Keep the cut steady and protect gym performance.",icon:"↘"};
}

function exerciseBelongsToDay(exName,type){
  const target=normalizeDayType(type);
  const name=String(exName||"").toLowerCase();
  const list=(TEMPLATES[target]||[]).map(e=>String(e.name||"").toLowerCase());
  if(list.includes(name))return true;

  // fallback matching for old/new exercise names and alternatives
  const family=typeof familyNames==="function" ? familyNames(exName).map(x=>String(x).toLowerCase()) : [];
  if(family.some(f=>list.includes(f)))return true;

  // loose keyword inference for older logs without dayType
  if(target==="Pull"){
    return /pulldown|row|rear|reverse|curl|hammer|lat|t[- ]?bar|bicep|preacher/.test(name);
  }
  if(target==="Push"){
    return /press|dip|tricep|lateral|shoulder|chest|fly|pushdown/.test(name);
  }
  if(target==="Legs"){
    return /leg|squat|rdl|hamstring|quad|calf|lunge|extension|curl/.test(name);
  }
  if(target==="Pump"){
    return /lateral|curl|pushdown|fly|raise|cable|pump/.test(name);
  }
  return false;
}
function inferredLogDayType(log){
  const direct=normalizeDayType(log.dayType||log.type||log.split||log.day);
  if(["Push","Pull","Pump","Legs","Floorball","Rest"].includes(direct))return direct;
  const ex=log.exercise||log.name||"";
  for(const t of ["Push","Pull","Legs","Pump"]){
    if(exerciseBelongsToDay(ex,t))return t;
  }
  return direct||"";
}








function cleanGymName(g){return String(g||state.gym||"Gym").trim()}
function coachInsightKey(type=state.dayType,gym=state.gym){
  return `${cleanGymName(gym)}__${normalizeDayType(type)}`;
}
function logGym(l){
  return cleanGymName(l.gym||l.gymName||l.location||l.place||"");
}
function gymMatchesLog(l,gym=state.gym){
  const lg=logGym(l);
  if(!lg)return false;
  return lg.toLowerCase()===cleanGymName(gym).toLowerCase();
}
function logsForDate(date=state.date,type=state.dayType,gym=null){
  const target=normalizeDayType(type);
  return (state.logs||[]).filter(l=>{
    if(l.date!==date)return false;
    if(gym && !gymMatchesLog(l,gym))return false;
    if(!target)return true;
    return inferredLogDayType(l)===target || exerciseBelongsToDay(l.exercise||l.name,target);
  });
}
function latestCompletedDateForType(type,gym=null){
  const target=normalizeDayType(type);
  const byDate={};
  (state.logs||[]).forEach(l=>{
    if(!l.date)return;
    if(gym && !gymMatchesLog(l,gym))return;
    if(inferredLogDayType(l)===target || exerciseBelongsToDay(l.exercise||l.name,target)){
      if(!byDate[l.date])byDate[l.date]=[];
      byDate[l.date].push(l);
    }
  });
  const dates=Object.keys(byDate).filter(d=>byDate[d].length>=2).sort();
  return dates[dates.length-1]||null;
}
function latestCoachInsight(type=state.dayType,gym=state.gym){
  const target=normalizeDayType(type);
  const key=coachInsightKey(target,gym);
  const savedGym=state.coachInsights?.[key];
  if(savedGym)return savedGym;

  // Legacy/general fallback from older versions.
  const savedGeneral=state.coachInsights?.[target];

  // Prefer gym-specific old logs if available.
  const lastGymDate=latestCompletedDateForType(target,gym);
  if(lastGymDate){
    const generated=generateCoachInsight(target,lastGymDate,gym);
    if(generated){
      state.coachInsights={...(state.coachInsights||{}),[key]:generated};
      persist();
      return generated;
    }
  }

  // If no gym-specific data, use old general insight or generate from any gym.
  if(savedGeneral)return {...savedGeneral,gym:savedGeneral.gym||"Any gym",fallback:true};

  const lastAnyDate=latestCompletedDateForType(target,null);
  if(!lastAnyDate)return null;
  const generated=generateCoachInsight(target,lastAnyDate,null);
  if(generated){
    state.coachInsights={...(state.coachInsights||{}),[target]:generated};
    persist();
    return {...generated,fallback:true};
  }
  return null;
}
function workoutTotals(date=state.date,type=state.dayType,gym=null){
  const rows=logsForDate(date,type,gym);
  const volume=rows.reduce((s,l)=>s+(Number(l.volume)||Number(l.weight)*Number(l.reps)||0),0);
  const groups={};
  rows.forEach(l=>{
    const name=l.exercise||l.name||"Exercise";
    if(!groups[name])groups[name]=[];
    groups[name].push(l);
  });
  return {rows,sets:rows.length,volume,groups};
}
function generateCoachInsight(type=state.dayType,date=state.date,gym=state.gym){
  const target=normalizeDayType(type);
  const actualGym=gym?cleanGymName(gym):null;
  const {rows,sets,volume,groups}=workoutTotals(date,target,actualGym);
  if(!rows.length)return null;
  const names=Object.keys(groups);
  const firstName=names[0]||"main lift";
  const firstSets=(groups[firstName]||[]).sort((a,b)=>(a.setNum||0)-(b.setNum||0));
  const gymText=actualGym ? ` at ${actualGym}` : "";
  let sentence=`Your last ${target}${gymText} on ${fmt(date)} had ${sets} sets across ${names.length} exercises. `;
  if(firstSets.length>=2 && Number(firstSets[firstSets.length-1].reps)<Number(firstSets[0].reps)){
    sentence+=`${firstName} reps dipped late, so keep the same load next ${target}${gymText}, rest longer, and aim to match or beat your early sets.`;
  }else{
    sentence+=`${firstName} looked stable. Next ${target}${gymText}, keep form strict and aim to add one clean rep before increasing load.`;
  }
  return {
    type:target,
    gym:actualGym||"Any gym",
    key:actualGym?coachInsightKey(target,actualGym):target,
    date,
    createdAt:new Date().toISOString(),
    sets,
    volume:Math.round(volume),
    exercises:names.length,
    text:sentence,
    backfilled:true
  };
}
function saveWorkoutInsight(type=state.dayType,date=state.date,gym=state.gym){
  const insight=generateCoachInsight(type,date,gym);
  if(!insight)return null;
  const key=coachInsightKey(type,gym);
  state.coachInsights={...(state.coachInsights||{}),[key]:insight,[normalizeDayType(type)]:insight};
  persist();
  return insight;
}
function backfillAllCoachInsights(){
  let count=0;
  const gyms=(state.gyms&&state.gyms.length?state.gyms:[state.gym]).filter(Boolean);
  ["Push","Pull","Legs","Pump"].forEach(t=>{
    gyms.forEach(g=>{
      const key=coachInsightKey(t,g);
      if(!state.coachInsights?.[key]){
        const d=latestCompletedDateForType(t,g);
        const insight=d?generateCoachInsight(t,d,g):null;
        if(insight){
          state.coachInsights={...(state.coachInsights||{}),[key]:insight};
          count++;
        }
      }
    });
    // General fallback too
    if(!state.coachInsights?.[t]){
      const d=latestCompletedDateForType(t,null);
      const insight=d?generateCoachInsight(t,d,null):null;
      if(insight){
        state.coachInsights={...(state.coachInsights||{}),[t]:insight};
        count++;
      }
    }
  });
  if(count){
    persist();
    render();
    toast(`Backfilled ${count} gym-specific insights`);
  }else{
    toast("No old sessions found to backfill");
  }
}


function coachInsightObservation(insight){
  if(!insight)return "No workout summary found yet.";
  const text=String(insight.text||"");
  if(/reps dipped|dipped late/i.test(text)){
    return "Performance dropped slightly toward the final set.";
  }
  if(/stable|looked stable/i.test(text)){
    return "Performance looked stable across the session.";
  }
  if(/PR|personal/i.test(text)){
    return "You hit a strong progression marker last session.";
  }
  return "Last session has enough data to guide today’s targets.";
}
function coachInsightAction(insight){
  if(!insight)return "Finish a workout to generate your next action.";
  const text=String(insight.text||"");
  if(/reps dipped|dipped late/i.test(text)){
    return "Keep the same load, rest longer, and aim to match your early sets.";
  }
  if(/add one clean rep|beat/i.test(text)){
    return "Keep the load and try to add one clean rep before increasing weight.";
  }
  return "Use the previous session as your baseline and beat reps with clean form.";
}
function coachInsightSub(insight){
  if(!insight)return "NXTFRM will use your completed workout to create a split-specific note.";
  const gym=insight.fallback ? "any gym" : (insight.gym||state.gym||"this gym");

function cycleDayType(){
  const order=["Push","Zone2","Floorball","Pull","Floorball","Pump","Rest"];
  const cur=normalizeDayType(state.dayType)||"Push";
  const idx=order.indexOf(cur);
  const next=order[(idx+1+order.length)%order.length];
  state.dayType=next;
  state.exercise=(TEMPLATES[next]&&TEMPLATES[next][0]&&TEMPLATES[next][0].name)||""; if(state.sessionPlans) delete state.sessionPlans[sessionKey(next,state.date,state.gym)];
  state.setNum=1;

  // Save as today's choice without permanently rewriting the weekly split.
  settings.dayOverrides=settings.dayOverrides||{};
  settings.dayOverrides[state.date]=next;

  persist();
  render();
  toast(`Today set to ${planMeta(next).label}`);
}

function localToday(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function setDateToToday({silent=false}={}){
  const today=localToday();
  state.date=today;
  settings.dayOverrides=settings.dayOverrides||{};
  const dow=new Date(today+"T12:00:00").getDay();
  state.dayType=settings.dayOverrides[today] || settings.weeklyPlan?.[dow] || PLAN[dow].type;
  state.exercise=(TEMPLATES[state.dayType]&&TEMPLATES[state.dayType][0]&&TEMPLATES[state.dayType][0].name)||"";
  state.setNum=1;
  localStorage.setItem("apm_last_open_date",today);
  persist();
  if(!silent)toast("Moved to today");
}
function rollToTodayIfNeeded(){
  const today=localToday();
  const lastOpen=localStorage.getItem("apm_last_open_date");
  const savedDate=state.date;

  // First run after an old version: if saved date is behind today's date, move forward.
  if(savedDate && savedDate < today){
    setDateToToday({silent:true});
    return true;
  }

  // If app stayed open across midnight, update on next resume/render check.
  if(lastOpen && lastOpen !== today && savedDate !== today){
    setDateToToday({silent:true});
    return true;
  }

  localStorage.setItem("apm_last_open_date",today);
  return false;
}

function migrateLegsCoreToAbCrunch(){
  try{
    state.sessionPlans=state.sessionPlans||{};
    Object.keys(state.sessionPlans).forEach(k=>{
      if(k.endsWith("__Legs") && Array.isArray(state.sessionPlans[k])){
        let plan=state.sessionPlans[k].map(x=>{
          if(["Plank","Core","Cable Crunch","Ab Wheel","Hanging Knee Raise","Hanging Leg Raise","Crunch","Machine Crunch"].includes(x))return "Ab Crunch";

        });
        if(!plan.includes("Ab Crunch"))plan.push("Ab Crunch");
        state.sessionPlans[k]=plan;
      }
    });
    persist();
  }catch(e){}
}

function weekStartString(dateStr=state.date){
  const d=new Date(dateStr+"T12:00:00");
  const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function hardTrainingDaysThisWeek(){
  const start=weekStartString();
  const days=new Set();
  (state.logs||[]).forEach(l=>{
    if(String(l.date||"")>=start)days.add(l.date);
  });
  (state.cardio||[]).forEach(c=>{
    const type=String(c.type||"").toLowerCase();
    if(String(c.date||"")>=start && (type.includes("floor") || Number(c.intensity||0)>=7))days.add(c.date);
  });
  return days.size;
}
function zone2MinutesThisWeekSafe(){
  try{return zone2MinutesThisWeek()}catch(e){return 0}
}
function strengthRetentionSignal(){
  try{
    const main=(state.logs||[]).filter(l=>["Push","Pull","Legs","Pump"].includes(normalizeDayType(l.dayType||"")));
    if(main.length<6)return {label:"Building data",score:8};
    const byEx={};
    main.forEach(l=>{
      const ex=l.exercise||l.name;
      if(!byEx[ex])byEx[ex]=[];
      byEx[ex].push(l);
    });
    let stable=0,total=0;
    Object.values(byEx).forEach(rows=>{
      rows=rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)) || Number(a.ts||0)-Number(b.ts||0));
      if(rows.length<4)return;
      const first=rows.slice(0,2).reduce((s,r)=>s+Number(r.weight||0)*Number(r.reps||0),0);
      const last=rows.slice(-2).reduce((s,r)=>s+Number(r.weight||0)*Number(r.reps||0),0);
      total++;
      if(last>=first*.94)stable++;
    });
    if(!total)return {label:"Building data",score:8};
    const ratio=stable/total;
    if(ratio>=.75)return {label:"Strength stable",score:18};
    if(ratio>=.5)return {label:"Slight drop",score:10};
    return {label:"Strength slipping",score:2};
  }catch(e){return {label:"Building data",score:8}}
}
function leanCutScore(){
  ensureLeanSettings();
  const rate=weeklyLossRate();
  const strength=strengthRetentionSignal();
  const readinessScore=(typeof readiness==="function"?readiness().score:70);
  const z2=zone2MinutesThisWeekSafe();
  const z2Target=Number(settings.zone2WeeklyTarget||ZONE2_WEEKLY_TARGET||90);
  const hardDays=hardTrainingDaysThisWeek();

  let score=50;
  let paceLabel="Tracking";
  if(rate===null){
    score+=8;
  }else if(rate>=0.45 && rate<=1.05){
    score+=18; paceLabel="Good pace";
  }else if(rate>1.05 && rate<=1.3){
    score+=10; paceLabel="Fast";
  }else if(rate>1.3){
    score-=6; paceLabel="Too fast";
  }else if(rate<0.25){
    score+=4; paceLabel="Slow";
  }

  score+=strength.score;

  let recoveryLabel="Okay";
  if(readinessScore>=75){score+=12; recoveryLabel="Ready";}
  else if(readinessScore>=60){score+=7; recoveryLabel="Manageable";}
  else {score-=8; recoveryLabel="Low";}

  let z2Label=z2>=z2Target ? "Target hit" : `${z2}/${z2Target} min`;
  if(z2>=Math.min(60,z2Target))score+=8;
  else if(z2>0)score+=4;

  let loadLabel=hardDays>=5 ? "High load" : hardDays>=3 ? "Moderate" : "Light";
  if(hardDays>=5)score-=8;
  else if(hardDays<=3)score+=4;

  score=Math.max(25,Math.min(96,Math.round(score)));

  let label="Good Cut";
  if(score>=85)label="Excellent Cut";
  else if(score>=70)label="Good Cut";
  else if(score>=55)label="Manage Carefully";
  else label="Recovery Risk";

  let message="Cut is moving well. Keep strength work controlled and avoid adding junk volume.";
  if(rate!==null && rate>1.25)message="Weight is dropping fast. Keep today conservative and prioritise recovery.";
  if(strength.label==="Strength slipping")message="Strength is slipping. Hold loads, reduce accessories, and avoid chasing PRs.";
  if(readinessScore<60)message="Readiness is low. Minimum workout or Zone 2 only is smarter today.";

  return {score,label,message,paceLabel,strengthLabel:strength.label,recoveryLabel,z2Label,loadLabel};
}

  return {logs,cardio,sets,volume,ex,types,z2,bw:bwForDate(date)};
}
function strengthRetentionDetails(){
  const keyExercises=["Incline","Press","Pulldown","Row","Leg Press","Romanian"];
  const rows=(state.logs||[]).filter(l=>keyExercises.some(k=>String(l.exercise||"").toLowerCase().includes(k.toLowerCase())));
  const by={};
  rows.forEach(l=>{
    const ex=l.exercise||"Exercise";
    if(!by[ex])by[ex]=[];
    by[ex].push(l);
  });
  const out=Object.entries(by).map(([ex,rs])=>{
    rs=rs.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))||Number(a.ts||0)-Number(b.ts||0));
    const first=rs.slice(0,2).reduce((s,r)=>s+Number(r.weight||0)*Number(r.reps||0),0);
    const last=rs.slice(-2).reduce((s,r)=>s+Number(r.weight||0)*Number(r.reps||0),0);
    let status="Building data";
    if(rs.length>=4){
      const ratio=first?last/first:1;
      status=ratio>=1.02?"Improving":ratio>=.94?"Stable":ratio>=.88?"Slight drop":"Significant drop";
    }
    return {ex,status,sets:rs.length};
  }).slice(0,5);
  if(!out.length)return [{ex:"Main lifts",status:"Building data",sets:0}];
  return out;
}

<script id="apex-v95-progress-command-centre">
// V95 Progress Command Centre. Uses existing apm_* data without changing schemas.
function apx95ProgressState(){
  if(!["overview","strength","body"].includes(state.progressView))state.progressView="overview";
  if(!["1M","3M","ALL"].includes(state.progressRange))state.progressRange="3M";
  return {view:state.progressView,range:state.progressRange};
}
function apx95SetView(view){
  state.progressView=view;
  state.apx95SelectedDate="";
  render();
}
function apx95SetRange(range){
  state.progressRange=range;
  state.apx95SelectedDate="";
  render();
}
function apx95Num(value){
  if(value===""||value===null||value===undefined)return null;
  const n=Number(value);
  return Number.isFinite(n)?n:null;
}
function apx95DateMs(date){
  const d=new Date(String(date||"")+"T12:00:00");
  return Number.isFinite(d.getTime())?d.getTime():0;
}
function apx95DailyRows(){
  const grouped={};
  (state.bws||[]).forEach((entry,index)=>{
    const weight=apx95Num(entry.weight);
    const date=String(entry.date||"");
    if(weight===null || !date)return;
    if(!grouped[date])grouped[date]=[];
    grouped[date].push({...entry,weight,_index:index});
  });
  return Object.keys(grouped).sort().map(date=>{
    const entries=grouped[date];
    const morning=entries.filter(x=>String(x.timeOfDay||"").toLowerCase()==="morning");
    const chosen=(morning.length?morning:entries).slice().sort((a,b)=>Number(a.ts||a._index)-Number(b.ts||b._index)).at(-1);
    return {...chosen,date,weight:Number(chosen.weight)};
  });
}
function apx95MovingRows(rows){
  return rows.map((row,index)=>{
    const end=apx95DateMs(row.date);
    const start=end-6*86400000;
    const values=rows.slice(0,index+1).filter(x=>{
      const ms=apx95DateMs(x.date);
      return ms>=start&&ms<=end;
    }).map(x=>Number(x.weight));
    const avg=values.reduce((sum,value)=>sum+value,0)/Math.max(1,values.length);
    return {...row,avg};
  });
}
function apx95TargetRange(){
  const low=Number(typeof goalLow==="function"?goalLow():settings.goalLow);
  const high=Number(typeof goalHigh==="function"?goalHigh():settings.goalHigh);
  return {
    low:Number.isFinite(low)?low:78,
    high:Number.isFinite(high)?high:80
  };
}
function apx95PeriodAverage(rows,startMs,endMs){
  const values=rows.filter(row=>{
    const ms=apx95DateMs(row.date);
    return ms>=startMs&&ms<=endMs;
  }).map(row=>Number(row.weight));
  if(values.length<2)return null;
  return values.reduce((sum,value)=>sum+value,0)/values.length;
}
function apx95WeekChange(rows){
  if(rows.length<4)return null;
  const end=apx95DateMs(rows.at(-1).date);
  const current=apx95PeriodAverage(rows,end-6*86400000,end);
  const previous=apx95PeriodAverage(rows,end-13*86400000,end-7*86400000);
  return current!==null&&previous!==null?current-previous:null;
}
function apx95SignedKg(value){
  if(value===null || !Number.isFinite(Number(value)))return "—";
  const n=Number(value);
  if(Math.abs(n)<.05)return "0.0kg";
  return (n>0?"+":"")+n.toFixed(1)+"kg";
}
function apx95ShortDate(date){
  try{return new Date(date+"T12:00:00").toLocaleDateString("en-SG",{day:"numeric",month:"short"})}
  catch(e){return date||""}
}
function apx95StrengthItems(){
  const families={};
  (state.logs||[]).forEach((log,index)=>{
    const weight=apx95Num(log.weight),reps=apx95Num(log.reps);
    const name=String(log.exercise||log.name||"").trim();
    if(!name||weight===null||reps===null||weight<=0||reps<=0)return;
    const family=typeof exerciseFamily==="function"?exerciseFamily(name):name;
    if(!families[family])families[family]={family,name,sets:0,lastIndex:index,dates:{}};
    const group=families[family];
    group.name=name;
    group.sets++;
    group.lastIndex=index;
    const date=String(log.date||state.date);
    const e1rm=weight*(1+reps/30);
    group.dates[date]=Math.max(Number(group.dates[date]||0),e1rm);
  });
  return Object.values(families).map(group=>{
    const sessions=Object.entries(group.dates).sort((a,b)=>a[0].localeCompare(b[0]));
    const latest=sessions.at(-1);
    const previous=sessions.at(-2);
    const delta=previous&&previous[1]>0?(latest[1]-previous[1])/previous[1]*100:null;
    let status="Building data",tone="neutral";
    if(delta!==null){
      if(delta>=1){status="Improving";tone="good"}
      else if(delta>=-3){status="Stable";tone="good"}
      else if(delta>=-6){status="Watch";tone="watch"}
      else{status="Dropping";tone="risk"}
    }
    return {
      ...group,
      sessions:sessions.length,
      latestDate:latest?.[0]||"",
      latestE1rm:latest?.[1]||0,
      delta,status,tone
    };
  }).sort((a,b)=>b.sessions-a.sessions||b.lastIndex-a.lastIndex).slice(0,8);
}
function apx95Verdict(rows,strengthItems){
  const target=apx95TargetRange();
  const latest=rows.at(-1);
  const weekChange=apx95WeekChange(rows);
  const lossRate=weekChange===null?null:-weekChange;
  const readinessScore=typeof readiness==="function"?readiness().score:70;
  const dropping=strengthItems.filter(x=>x.tone==="risk").length;
  const watching=strengthItems.filter(x=>x.tone==="watch").length;
  let score=null;
  try{score=rows.length>=4&&typeof leanCutScore==="function"?leanCutScore().score:null}catch(e){}
  if(rows.length<4){
    return {title:"Building your signal",message:"Log at least four morning weigh-ins before NXTFRM judges the trend.",action:"KEEP LOGGING CONSISTENTLY",tone:"",score};
  }
  if(latest&&latest.weight>=target.low&&latest.weight<=target.high){
    return {title:"Inside your lean zone",message:"You have reached the target range. Shift the goal from faster loss to stable performance.",action:"PREPARE MAINTENANCE",tone:"",score};
  }
  if((lossRate!==null&&lossRate>1.3) || readinessScore<58 || dropping>0){
    return {title:"Protect recovery",message:dropping?"At least one lift is dropping meaningfully. Hold loads and reduce non-essential volume.":"Cut speed or readiness is becoming aggressive. Keep training conservative this week.",action:"HOLD LOADS · REDUCE VOLUME",tone:"risk",score};
  }
  if(lossRate!==null&&lossRate>=.3&&lossRate<=1.05&&watching===0){
    return {title:"Cut on track",message:"The weekly average is moving at a controlled pace without a clear strength warning.",action:"MAINTAIN CURRENT PLAN",tone:"",score};
  }
  const span=apx95DateMs(rows.at(-1).date)-apx95DateMs(rows[0].date);
  if(lossRate!==null&&lossRate<.2&&span>=14*86400000){
    return {title:"Trend needs review",message:"The weight average has barely moved across the recent period. Check intake consistency before changing training.",action:"REVIEW INTAKE CONSISTENCY",tone:"warn",score};
  }
  return {title:"Hold steady",message:"The signal is still settling. Avoid reacting to one weigh-in and let the weekly average develop.",action:"KEEP THE PLAN UNCHANGED",tone:"",score};
}
function apx95ProgressHeroHTML(rows,verdict){
  const moving=apx95MovingRows(rows);
  const latest=moving.at(-1);
  const target=apx95TargetRange();
  const weekChange=apx95WeekChange(rows);

      <div class="apx95-hero-metric"><span>To lean zone</span><b>${remaining===null?"—":remaining<=.05?"In zone":remaining.toFixed(1)+"kg"}</b></div>

      <div class="apx95-rail"><span style="width:${progress.toFixed(1)}%"></span></div>
    </div>
  </div>`;
}

function apx95ChartHTML(rows){

  if(!rows.length){

  const days=cfg.range==="1M"?30:cfg.range==="3M"?90:100000;

  const target=apx95TargetRange();
  const values=data.flatMap(row=>[row.weight,row.avg]).concat([target.low,target.high]);
  let max=Math.max(...values)+.5,min=Math.min(...values)-.5;
  if(max-min<2){max+=1;min-=1}
  const W=360,H=220,pL=31,pR=13,pT=14,pB=26,plotW=W-pL-pR,plotH=H-pT-pB;
  const y=value=>pT+(max-value)/(max-min)*plotH;
  const x=index=>pL+(data.length===1?plotW/2:index/(data.length-1)*plotW);
  const points=data.map((row,index)=>({...row,x:x(index),rawY:y(row.weight),avgY:y(row.avg)}));

  const grid=[max,(max+min)/2,min];

  return `<div class="apx95-card">
    <div class="apx95-card-head">
      <div><div class="apx95-card-kicker">Bodyweight trend</div><div class="apx95-card-title">Scale vs 7-day signal</div><div class="apx95-card-sub">${rows.length<4?"Keep logging to strengthen the signal.":"Daily noise stays faint; the trend stays clear."}</div></div>
      <div class="apx95-range">${["1M","3M","ALL"].map(range=>`<button class="${cfg.range===range?"active":""}" onclick="apx95SetRange('${range}')">${range}</button>`).join("")}</div>
    </div>
    <div class="apx95-chart-stage">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Bodyweight and seven day average chart">
        <defs>
          <linearGradient id="apx95Line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a56ef7"/><stop offset="100%" stop-color="#b18aff"/></linearGradient>
          <linearGradient id="apx95Area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b18aff" stop-opacity=".16"/><stop offset="100%" stop-color="#b18aff" stop-opacity="0"/></linearGradient>
        </defs>
        ${grid.map(value=>`<line class="apx95-grid" x1="${pL}" y1="${y(value).toFixed(1)}" x2="${W-pR}" y2="${y(value).toFixed(1)}"></line><text class="apx95-axis" x="3" y="${(y(value)+3).toFixed(1)}">${value.toFixed(1)}</text>`).join("")}
        <rect class="apx95-zone" x="${pL}" y="${zoneY.toFixed(1)}" width="${plotW}" height="${zoneH.toFixed(1)}" rx="7"></rect>
        <text class="apx95-zone-label" x="${W-pR-4}" y="${(zoneY+zoneH/2+3).toFixed(1)}" text-anchor="end">LEAN ZONE</text>
        ${points.length>1?`<path class="apx95-raw-line" d="${rawPath}"></path><path class="apx95-trend-area" d="${area}"></path>`:""}
        <path class="apx95-trend-line" d="${trendPath}"></path>
        ${points.map(point=>`<circle class="apx95-point" cx="${point.x.toFixed(1)}" cy="${point.avgY.toFixed(1)}" r="${point.date===selected.date?5:3}"></circle><circle class="apx95-hit" cx="${point.x.toFixed(1)}" cy="${point.avgY.toFixed(1)}" r="18" onclick="apx95InspectDate('${jss(point.date)}')"></circle>`).join("")}
        <text class="apx95-axis" x="${pL}" y="${H-8}">${apx95ShortDate(data[0].date)}</text>
        <text class="apx95-axis" x="${W-pR}" y="${H-8}" text-anchor="end">${apx95ShortDate(data.at(-1).date)}</text>
      </svg>
    </div>
    <div class="apx95-chart-readout">
      <div><span>${apx95ShortDate(selected.date)} · ${esc(selected.timeOfDay||"Recorded")}</span><b>${Math.abs(selectedDelta)<.05?"Right on trend":Math.abs(selectedDelta).toFixed(1)+"kg "+(selectedDelta>0?"above":"below")+" trend"}</b></div>
      <strong>${selected.weight.toFixed(1)}kg</strong>
    </div>
    <div class="apx95-legend"><span><i class="apx95-dot raw"></i>Scale</span><span><i class="apx95-dot"></i>7-day trend</span><span><i class="apx95-dot zone"></i>Lean zone</span></div>
  </div>`;
}

function apx96FmtCompact(value,digits=1){

function apx96TodaySummary(){
  const logs=(state.logs||[]).filter(x=>x.date===state.date);

function apx96WeekRows(){
  const base=new Date(state.date+"T12:00:00");
  const monday=new Date(base);
  monday.setDate(base.getDate()-((base.getDay()+6)%7));
  return Array.from({length:7},(_,index)=>{
    const date=new Date(monday);
    date.setDate(monday.getDate()+index);
    const key=date.toISOString().slice(0,10);
    const summary=typeof summaryForDate==="function"?summaryForDate(key):{sets:0,z2:0,bw:null};
    const floor=(state.floorball||[]).some(x=>x.date===key);
    const dow=date.getDay();
    const type=settings.dayOverrides?.[key]||settings.weeklyPlan?.[dow]||PLAN[dow]?.type||"Rest";
    return {key,date,type,summary,floor};
  });
}

let apx96RestEnd=0;

function apx96RestRemaining(){

function apx96FormatTimer(seconds){

function apx96TickTimer(){

  if(!remaining&&apx96RestEnd){

function apx96StartRest(seconds){

function apx96AdjustRest(seconds){

<script id="nxtfrm-v98-premium">
// V98 product layer. Existing records, storage keys, backup signature and cloud payload stay unchanged.
function nxt98WeeklyTotals(){
  const rows=apx96WeekRows();
  return {
    sets:rows.reduce((sum,row)=>sum+Number(row.summary.sets||0),0),
    sessions:rows.filter(row=>Number(row.summary.sets||0)>0||row.floor).length,
    cardio:rows.reduce((sum,row)=>sum+Number(row.summary.z2||0),0)
  };
}
function nxt98EstimatedMinutes(){
  const sets=template().reduce((sum,item)=>sum+Number(item.sets||3),0);
  return sets?Math.max(25,Math.round((sets*2.35+8)/5)*5):0;
}
function nxt98CoachSignal(){
  const insight=latestCoachInsight(state.dayType,state.gym);
  const r=readiness();
  if(insight)return {title:coachInsightAction(insight),message:coachInsightObservation(insight)+" "+String(insight.text||""),tone:"SESSION INTELLIGENCE"};
  if(r.score>=80)return {title:"Push with control",message:"You are ready to progress. Chase clean reps before extra load.",tone:"GREEN LIGHT"};
  if(r.score>=65)return {title:"Train the plan",message:"Use the full session and keep one or two clean reps in reserve.",tone:"ON PLAN"};
  return {title:"Protect recovery",message:"Use Minimum mode or easy Zone 2. Today is not a PR day.",tone:"RECOVERY FIRST"};
}
function apx96TrainHeaderHTML(){
  const p=plan(),progress=dayProgress();
  return `<div class="apx96-train-head nxt98-train-head">
    <div class="apx96-card-head"><div><div class="apx96-kicker">Live session · ${esc(state.gym)}</div><div class="apx96-train-title"><button onclick="cycleDayType()">${esc(p.label)}</button></div><div class="apx96-soft" style="margin-top:6px">${fmt(state.date)} · all progress saves automatically</div></div><button class="apx96-chip lime" onclick="showSessionSheet()">CHANGE</button></div>
    <div class="apx96-session-progress"><div class="apx96-session-copy"><span>${progress.done} of ${progress.total} sets complete</span><span>${progress.pct}%</span></div><div class="apx96-session-rail"><span style="width:${progress.pct}%"></span></div></div>

  </div>`;
}
function apx96RestTimerHTML(){
  const remaining=apx96RestRemaining();
  return `<div class="nxt98-timer"><div class="nxt98-timer-pulse">◷</div><div class="nxt98-timer-copy"><span>Recovery clock</span><b id="apx96TimerValue">${remaining?apx96FormatTimer(remaining):"READY"}</b></div><div class="nxt98-timer-actions"><button onclick="apx96AdjustRest(30)">+30</button><button onclick="apx96SkipRest()">SKIP</button></div></div>`;

function nxt98SetInput(id,value){
  const el=document.getElementById(id);
  if(!el)return;
  el.value=value;
  el.dispatchEvent(new Event("input",{bubbles:true}));
  el.focus();
}
function nxt98LoadCue(last,suggested,repTarget){
  if(!last)return {label:"First signal",copy:"Set a clean baseline at "+(suggested||"a controlled load")+" × "+repTarget+"+",icon:"◎"};
  const diff=Number(suggested)-Number(last.weight);
  if(Number.isFinite(diff)&&diff>.05)return {label:"Progression target",copy:"Move up "+diff.toFixed(1)+"kg only if rep speed stays clean.",icon:"↗"};
  if(Number(last.reps)<Number(repTarget))return {label:"Rep recovery",copy:"Match "+last.weight+"kg and rebuild to "+repTarget+" clean reps.",icon:"→"};
  return {label:"Beat the log",copy:"Match "+last.weight+"kg and add one clean rep before load.",icon:"↗"};
}
function apx96FocusHTML(){
  const ex=state.exercise||template()[0]?.name||"";
  if(!ex)return `<div class="apx96-card"><div class="apx96-card-title">No exercise selected</div></div>`;
  const target=currentTargetForExercise(ex),done=safeSetsDone(ex),setNum=Math.min(done+1,Number(target.sets||3));
