<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<title>NXTFRM VNext — Prototype</title>
<link rel="stylesheet" href="vnext.css">
</head>
<body class="harness">

<!-- Prototype harness only. Not part of the product. -->
<div class="devbar" role="group" aria-label="Prototype controls">
  <button type="button" data-w="390" aria-pressed="true">390</button>
  <button type="button" data-w="375" aria-pressed="false">375</button>
  <button type="button" data-w="320" aria-pressed="false">320</button>
  <span class="sep"></span>
  <button type="button" data-goto="today">Today · lift</button>
  <button type="button" data-goto="today-rest">Today · rest</button>
  <button type="button" data-goto="train">Train</button>
  <button type="button" data-goto="progress">Weight</button>
  <button type="button" data-goto="history">History</button>
</div>

<div id="app">
  <div id="view"></div>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div id="overlay"></div>
</div>

<script src="data.js"></script>
<script src="vnext.js"></script>
</body>
</html>
